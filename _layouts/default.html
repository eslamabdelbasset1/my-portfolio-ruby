<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Primary Meta Tags -->
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="title"
    content="{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}" />
  <meta name="description"
    content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}" />
  <meta name="keywords"
    content="{% if page.keywords %}{{ page.keywords }}{% else %}software engineer for hire, senior backend developer, full stack engineer, enterprise software development, custom software solutions, scalable web applications, microservices architecture, API development services, cloud solutions architect, software consultant, backend developer, laravel, php, react{% endif %}" />
  <meta name="author" content="Eslam Abdelbasset" />
  <meta name="robots" content="{% if page.robots %}{{ page.robots }}{% else %}index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1{% endif %}" />
  <meta name="language" content="English" />
  <meta name="geo.region" content="EG-C" />
  <meta name="geo.placename" content="Cairo" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="{% if page.og_type %}{{ page.og_type }}{% else %}website{% endif %}" />
  <meta property="og:url" content="{% if page.canonical %}{{ page.canonical }}{% else %}https://eslamabdelbasset.vercel.app/{% endif %}" />
  <meta property="og:title"
    content="{% if page.og_title %}{{ page.og_title }}{% elsif page.title %}{{ page.title }}{% else %}{{ site.og_title }}{% endif %}" />
  <meta property="og:description"
    content="{% if page.og_description %}{{ page.og_description }}{% elsif page.description %}{{ page.description }}{% else %}{{ site.og_description }}{% endif %}" />
  <meta property="og:image" content="https://eslamabdelbasset.vercel.app/assets/me-image.png" />
  <meta property="og:image:secure_url" content="https://eslamabdelbasset.vercel.app/assets/me-image.png" />
  <meta property="og:image:alt" content="Eslam Abdelbasset - Senior Backend Developer & Full Stack Engineer" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1254" />
  <meta property="og:image:height" content="1254" />
  <meta property="og:site_name" content="Eslam Abdelbasset Portfolio" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:site" content="@eslamabdelbasset1" />
  <meta property="twitter:creator" content="@eslamabdelbasset1" />
  <meta property="twitter:url" content="{% if page.canonical %}{{ page.canonical }}{% else %}https://eslamabdelbasset.vercel.app/{% endif %}" />
  <meta property="twitter:title"
    content="{% if page.og_title %}{{ page.og_title }}{% elsif page.title %}{{ page.title }}{% else %}{{ site.og_title }}{% endif %}" />
  <meta property="twitter:description"
    content="{% if page.og_description %}{{ page.og_description }}{% elsif page.description %}{{ page.description }}{% else %}{{ site.og_description }}{% endif %}" />
  <meta property="twitter:image" content="https://eslamabdelbasset.vercel.app/assets/me-image.png" />
  <meta property="twitter:image:alt" content="Eslam Abdelbasset - Senior Backend Developer & Full Stack Engineer" />

  <!-- Canonical & Alternate Links -->
  <link rel="canonical" href="{% if page.canonical %}{{ page.canonical }}{% else %}https://eslamabdelbasset.vercel.app/{% endif %}" />

  <!-- Structured Data -->
  {% include structured-data.html %}

  <!-- Local Self-Hosted Typography Fonts (No External CDN) -->
  <link rel="stylesheet" href="/assets/vendor/fonts/fonts.css" />
  <link rel="stylesheet" href="/assets/style.css" />

  <!-- Local Prism.js Dark Theme (No External CDN) -->
  <link rel="stylesheet" href="/assets/vendor/prism/prism-tomorrow.min.css" />
  <link rel="icon" href="/favicon.svg?v=4" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/assets/me-image.png" />
  <link rel="mask-icon" href="/favicon.svg" color="#026BFF" />

  <!-- Mobile & Browser Appearance Meta Tags -->
  <meta name="theme-color" content="#080808" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#080808" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#080808" />
  <meta name="color-scheme" content="dark" />
  <meta name="supported-color-schemes" content="dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Google Tag Manager -->
  <script>
    (function (w, d, s, l, i) {
      w[l] = w[l] || [];
      w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
      var f = d.getElementsByTagName(s)[0],
        j = d.createElement(s),
        dl = l != "dataLayer" ? "&l=" + l : "";
      j.async = true;
      j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
      f.parentNode.insertBefore(j, f);
    })(window, document, "script", "dataLayer", "GTM-5723R25B");
  </script>
  <!-- End Google Tag Manager -->
</head>

<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript>
    <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5723R25B" height="0" width="0"
      style="display: none; visibility: hidden"></iframe>
  </noscript>
  <!-- End Google Tag Manager (noscript) -->

  {% include navigation.html %}

  <main class="main-content" id="main-content">
    {{ content }}
  </main>

  {% include footer.html %}

  <!-- Local Prism.js for Syntax Highlighting (Offline & CDN-Free) -->
  <script src="/assets/vendor/prism/prism.min.js"></script>

  <!-- Local Lucide Icons (Offline & CDN-Free) -->
  <script src="/assets/vendor/lucide.min.js"></script>
  <script>
    if (typeof lucide !== 'undefined') {
      lucide.createIcons();
    }
  </script>

  <!-- JavaScript Files -->
  <script src="/assets/projects-data.js"></script>
  <script src="/assets/utils.js"></script>
  <script src="/assets/project-slider.js"></script>
  <script src="/assets/navigation.js"></script>
  <script src="/assets/main.js"></script>
</body>

</html>
